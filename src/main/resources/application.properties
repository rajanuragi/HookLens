# Application configuration
spring.application.name=HookLens
server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hooklens_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JWT configuration
jwt.secret=${JWT_SECRET}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable SQL statement logging
spring.jpa.show-sql=false

# Reduce Spring Security logging
logging.level.org.springframework.security=WARN

# Keep Tomcat access logging disabled
server.tomcat.accesslog.enabled=false

# Logging configuration
logging.level.root=INFO
logging.level.com.hooklens.hooklens=DEBUG
logging.level.org.springframework.web=INFO
